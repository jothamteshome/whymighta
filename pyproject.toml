[project]
name = "whymighta"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiofiles==25.1.0",
    "aiohttp==3.13.5",
    "anthropic==0.97.0",
    "asyncpg==0.31.0",
    "disnake==2.12.0",
    "openai==2.33.0",
    "pillow==12.2.0",
    "PyNaCl==1.6.2",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    "pydantic_core==2.46.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
